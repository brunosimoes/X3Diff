name: Verify X3Diff
# Pushes to main are verified by the Pages workflow, which calls this one and
# publishes only if it passes; running it here as well would repeat every test.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:preview
      - run: npm audit --omit=dev --registry=https://registry.npmjs.org
